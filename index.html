<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>El Paso West Side 79912</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
#map{position:fixed;inset:0}
.panel{position:fixed;z-index:1000;left:12px;bottom:12px;max-width:360px;width:calc(100% - 24px);max-height:72vh;overflow:auto;background:#111827f2;color:#f8fafc;border:1px solid #334155;border-radius:14px;padding:12px 14px}
h1{font-size:15px;margin:0 0 4px}
.sub{font-size:12px;color:#94a3b8;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin:0 0 8px}
.tabs button{flex:1;border:1px solid #334155;background:#0b1220;color:#e2e8f0;border-radius:8px;padding:6px 8px;cursor:pointer}
.tabs button.on{background:#1d4ed8}
.row{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.leaflet-popup-content{color:#0f172a;min-width:200px}
.pop-a{font-weight:700}
.pop-p{font-weight:600}
.pop-g{font-size:11px;color:#64748b}
a{color:#2563eb}
</style></head>
<body>
<div id="map"></div>
<aside class="panel">
<h1>El Paso West Side 79912</h1>
<div class="tabs"><button id="tabWO" class="on">Work orders</button><button id="tabSS">Soft start</button></div>
<p class="sub" id="subline">Tap a pin for name and phone</p>
<div id="legend"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WO_GROUPS={1:{name:"1 Lakehurst mid",color:"#1e3a8a"},2:{name:"2 Villa Vanessa / El Parque",color:"#166534"},3:{name:"3 Le Conte",color:"#c2410c"},4:{name:"4 Lakehurst North",color:"#7c3aed"},5:{name:"5 Ranchos / Southwind",color:"#ea580c"},6:{name:"6 Park Hills / Las Aves",color:"#6d28d9"},7:{name:"7 Via Serena / Calle Lago",color:"#0d9488"}};
const SS_GROUPS={1:{name:"SS1 Lakehurst / Windcrest",color:"#1e3a8a"},2:{name:"SS2 Arredondo / Bristol",color:"#b91c1c"},3:{name:"SS3 Le Conte",color:"#c2410c"},5:{name:"SS5 El Parque",color:"#166534"},6:{name:"SS6 Villa Hermosa",color:"#0f766e"},7:{name:"SS7 Brisa Del Mar",color:"#7c3aed"},8:{name:"SS8 Park Hills / Aves",color:"#6d28d9"},9:{name:"SS9 Via Serena / Lago",color:"#0d9488"},11:{name:"SS11 Ranchos",color:"#ea580c"},21:{name:"SS21 Tepic / Villa Vanessa",color:"#047857"}};
const map=L.map("map").setView([31.855,-106.545],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"OSM"}).addTo(map);
function popupHtml(s,label){const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.a+", El Paso, TX 79912");const digits=(s.p||"").replace(/\D/g,"");const tel=digits.length===10?"+1"+digits:"";const name=s.n?"<div>"+s.n+"</div>":"";const phone=s.p?"<div class=pop-p><a href='tel:"+tel+"'>"+s.p+"</a></div>":"";return "<div class=pop-g>"+label+"</div><div class=pop-a>"+s.a+"</div>"+name+phone+"<div><a href='"+maps+"' target=_blank>Google Maps</a></div>";}
const woLayers={},ssLayers={};
Object.keys(WO_GROUPS).forEach(k=>woLayers[k]=L.layerGroup());
Object.keys(SS_GROUPS).forEach(k=>ssLayers[k]=L.layerGroup());
const WO_STOPS=[{"g":"1","a":"7424 Lakehurst Rd","lat":31.85208,"lon":-106.56169,"n":"Liz Solano","p":"(915) 726-3071"},{"g":"1","a":"7533 Lakehurst Rd","lat":31.85524,"lon":-106.56496,"n":"Armando Montanez","p":"(915) 309-5777"},{"g":"2","a":"705 Villa Vanessa Dr","lat":31.85319,"lon":-106.55231,"n":"Judy McClung","p":"(915) 581-4775"},{"g":"2","a":"601 El Parque Dr","lat":31.84977,"lon":-106.55139,"n":"Telma Lozano","p":"(915) 626-6181"},{"g":"3","a":"7713 Le Conte Dr","lat":31.8447,"lon":-106.5699,"n":"Brandy Ponzio","p":"(360) 333-8247"},{"g":"4","a":"735 Arredondo Dr","lat":31.85661,"lon":-106.5624,"n":"Thomas Schwieger","p":"(915) 240-8043"},{"g":"4","a":"7509 Windcrest Dr","lat":31.86252,"lon":-106.56539,"n":"Mary Duffy","p":"(915) 526-8136"},{"g":"5","a":"6883 Oveja Ave","lat":31.84876,"lon":-106.54562,"n":"John Lowe","p":"(915) 588-1659"},{"g":"6","a":"6484 Calle Placido Dr","lat":31.86686,"lon":-106.53499,"n":"Sean Cooper","p":"(216) 644-1367"},{"g":"7","a":"1337 Calle Lago","lat":31.86895,"lon":-106.52016,"n":"Leticia Fernandez","p":"(703) 862-9230"}];
WO_STOPS.forEach(s=>{const m=WO_GROUPS[s.g];L.circleMarker([s.lat,s.lon],{radius:8,color:"#fff",weight:2,fillColor:m.color,fillOpacity:0.95}).bindPopup(popupHtml(s,m.name)).bindTooltip(s.n+" - "+s.p).addTo(woLayers[s.g]);});
const SS_STOPS=[{"g":"1","a":"7424 Lakehurst Rd","n":"Liz Solano","p":"(915) 726-3071","lat":31.85203,"lon":-106.56042},{"g":"1","a":"7509 Windcrest Dr","n":"Mary Duffy","p":"(915) 526-8136","lat":31.86252,"lon":-106.56539},{"g":"1","a":"870 Melville Ln","n":"Belinda Armendariz","p":"(915) 244-4767","lat":31.85985,"lon":-106.56479},{"g":"2","a":"735 Arredondo Dr","n":"Thomas Schwieger","p":"(915) 240-8043","lat":31.85661,"lon":-106.5624},{"g":"2","a":"640 Bristol Dr","n":"Olga Maynard","p":"(915) 491-1339","lat":31.85087,"lon":-106.55868},{"g":"3","a":"7713 Le Conte Dr","n":"Brandy Ponzio","p":"(360) 333-8247","lat":31.8447,"lon":-106.5699},{"g":"5","a":"601 El Parque Dr","n":"Telma Lozano","p":"(915) 626-6181","lat":31.84977,"lon":-106.55139},{"g":"6","a":"7064 Villa Hermosa Dr","n":"Albert Hernandez","p":"(915) 503-8643","lat":31.85035,"lon":-106.55228},{"g":"7","a":"6617 Brisa Del Mar Dr","n":"Virginia Vasquez","p":"(915) 373-4240","lat":31.86094,"lon":-106.54038},{"g":"8","a":"6484 Calle Placido Dr","n":"Sean Cooper","p":"(216) 644-1367","lat":31.86686,"lon":-106.53499},{"g":"8","a":"921 Las Aves Pl","n":"Michael Oyetunde","p":"(915) 867-9391","lat":31.86243,"lon":-106.54527},{"g":"9","a":"1337 Calle Lago","n":"Leticia Fernandez","p":"(703) 862-9230","lat":31.86895,"lon":-106.52016},{"g":"11","a":"6883 Oveja Ave","n":"John Lowe","p":"(915) 588-1659","lat":31.84876,"lon":-106.54562},{"g":"21","a":"705 Villa Vanessa Dr","n":"Judy McClung","p":"(915) 581-4775","lat":31.85319,"lon":-106.55231}];
SS_STOPS.forEach(s=>{const m=SS_GROUPS[s.g]||{name:"SS"+s.g,color:"#64748b"};if(!ssLayers[s.g])ssLayers[s.g]=L.layerGroup();L.circleMarker([s.lat,s.lon],{radius:8,color:"#fff",weight:2,fillColor:m.color,fillOpacity:0.95}).bindPopup(popupHtml(s,m.name)).bindTooltip(s.n+" - "+s.p).addTo(ssLayers[s.g]);});
function clearAll(){Object.values(woLayers).forEach(l=>map.removeLayer(l));Object.values(ssLayers).forEach(l=>map.removeLayer(l));}
function renderLegend(groups,layers){const el=document.getElementById("legend");el.innerHTML="";Object.entries(groups).forEach(([k,v])=>{const n=layers[k]?layers[k].getLayers().length:0;const row=document.createElement("label");row.className="row";row.innerHTML="<input type=checkbox checked><span class=dot style=background:"+v.color+"></span><span>"+v.name+" ("+n+")</span>";row.querySelector("input").onchange=e=>e.target.checked?map.addLayer(layers[k]):map.removeLayer(layers[k]);el.appendChild(row);});}
function showWO(){clearAll();Object.values(woLayers).forEach(l=>map.addLayer(l));document.getElementById("tabWO").classList.add("on");document.getElementById("tabSS").classList.remove("on");document.getElementById("subline").textContent="Work orders - tap pin for name and phone";renderLegend(WO_GROUPS,woLayers);}
function showSS(){clearAll();Object.values(ssLayers).forEach(l=>map.addLayer(l));document.getElementById("tabSS").classList.add("on");document.getElementById("tabWO").classList.remove("on");document.getElementById("subline").textContent="Soft start - tap pin for name and phone";renderLegend(SS_GROUPS,ssLayers);}
document.getElementById("tabWO").onclick=showWO;document.getElementById("tabSS").onclick=showSS;showWO();
</script></body></html>
