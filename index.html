<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>El Paso West Side 79912</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
#map{position:fixed;inset:0}
.panel{position:fixed;z-index:1000;left:12px;bottom:12px;max-width:360px;width:calc(100% - 24px);max-height:72vh;overflow:auto;background:#111827f2;color:#f8fafc;border:1px solid #334155;border-radius:14px;padding:12px 14px}
h1{font-size:15px;margin:0 0 4px}
.sub{font-size:12px;color:#94a3b8;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin:0 0 8px}
.tabs button{flex:1;border:1px solid #334155;background:#0b1220;color:#e2e8f0;border-radius:8px;padding:6px 8px;cursor:pointer}
.tabs button.on{background:#1d4ed8}
.bulk{display:flex;gap:6px;margin:0 0 8px}
.bulk button{flex:1;border:1px solid #334155;background:#0b1220;color:#e2e8f0;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12px}
.bulk button:hover{background:#1e293b}
.allbtns{display:flex;gap:6px;margin:0 0 8px}
.allbtns button{flex:1;border:1px solid #334155;background:#0b1220;color:#e2e8f0;border-radius:8px;padding:6px 8px;cursor:pointer}
.allbtns button:hover{background:#1e293b}
.row{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0;cursor:pointer}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.leaflet-popup-content{color:#0f172a;min-width:200px}
.pop-a{font-weight:700}
.pop-p{font-weight:600}
.pop-g{font-size:11px;color:#64748b}
a{color:#2563eb}
</style></head>
<body>
<div id="map"></div>
<aside class="panel">
<h1>El Paso West Side 79912</h1>
<div class="tabs"><button id="tabWO" class="on">Work orders</button><button id="tabSS">Soft start</button></div>
<p class="sub" id="subline">Tap a pin for name and phone</p>
<div class="allbtns"><button type="button" id="btnAll">Select all</button><button type="button" id="btnNone">Deselect all</button></div>
<div id="legend"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WO_GROUPS={1:{name:"1 Lakehurst mid",color:"#1e3a8a"},2:{name:"2 Villa Vanessa / El Parque",color:"#166534"},3:{name:"3 Le Conte",color:"#c2410c"},4:{name:"4 Lakehurst North",color:"#7c3aed"},5:{name:"5 Ranchos / Southwind",color:"#ea580c"},6:{name:"6 Park Hills / Las Aves",color:"#6d28d9"},7:{name:"7 Via Serena / Calle Lago",color:"#0d9488"}};

:"#9F0BEA"},34:{name:"SS34 Via De La Paz / Via Cuesta (13)",color:"#2DB760"},35:{name:"SS35 Metate / Via De La Paz (12)",color:"#EA1D0B"},36:{name:"SS36 Cerrito Perdido / Quinta Real (7)",color:"#3A60EA"},37:{name:"SS37 Via Appia (1)",color:"#61B709"}};
const map=L.map("map").setView([31.855,-106.545],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"OSM"}).addTo(map);
function popupHtml(s,label){
 const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((s.a||"")+", El Paso, TX 79912");
 const digits=(s.p||"").replace(/\D/g,"");
 const tel=digits.length===11?"+"+digits:(digits.length===10?"+1"+digits:"");
 const name=s.n?"<div>"+s.n+"</div>":"";
 const phone=s.p?(tel?"<div class=pop-p><a href='tel:"+tel+"'>"+s.p+"</a></div>":"<div class=pop-p>"+s.p+"</div>"):"";
 return "<div class=pop-g>"+label+"</div><div class=pop-a>"+(s.a||"")+"</div>"+name+phone+"<div><a href='"+maps+"' target=_blank rel=noopener>Google Maps</a></div>";
}
const woLayers={},ssLayers={},seenSS={};
Object.keys(WO_GROUPS).forEach(k=>woLayers[k]=L.layerGroup());
Object.keys(SS_GROUPS).forEach(k=>ssLayers[k]=L.layerGroup());
const WO_STOPS=[{"g":"1","a":"7424 Lakehurst Rd","lat":31.852083,"lon":-106.56169,"n":"Liz Solano","p":"(915) 726-3071"},{"g":"1","a":"7533 Lakehurst Rd","lat":31.855235,"lon":-106.564962,"n":"Armando Montanez","p":"(915) 309-5777"},{"g":"1","a":"7371 Lakehurst Rd","lat":31.849716,"lon":-106.560317,"n":"Ana Martina Archibald","p":"(915) 503-7360"},{"g":"2","a":"705 Villa Vanessa Dr","lat":31.853193,"lon":-106.552313,"n":"Judy McClung","p":"(915) 581-4775"},{"g":"2","a":"712 Villa Vanessa Dr","lat":31.854079,"lon":-106.552119,"n":"Javier Luna","p":"(915) 309-7190"},{"g":"3","a":"7444 Le Conte Dr","lat":31.848454,"lon":-106.56219,"n":"Juan chacon","p":"(915) 309-2872"},{"g":"3","a":"7713 Le Conte Dr","lat":31.844703,"lon":-106.569898,"n":"Brandy Ponzio","p":"(360) 333-8247"},{"g":"4","a":"735 Arredondo Dr","lat":31.85661,"lon":-106.562403,"n":"Thomas Schwieger","p":"(915) 240-8043"},{"g":"6","a":"6617 Brisa Del Mar Dr","lat":31.860943,"lon":-106.540382,"n":"Virginia Vasquez","p":"(915) 373-4240"},{"g":"3","a":"640 Bristol Dr","lat":31.850868,"lon":-106.558678,"n":"Olga Maynard","p":"(915) 491-1339"},{"g":"6","a":"6484 Calle Placido Dr","lat":31.866855,"lon":-106.534987,"n":"Sean Cooper","p":"(216) 644-1367"},{"g":"6","a":"6452 Calle Vista Dr","lat":31.865396,"lon":-106.533087,"n":"Cathy Puschett","p":"(915) 328-5913"},{"g":"7","a":"1337 Calle Lago","lat":31.868948,"lon":-106.520155,"n":"Leticia Fernandez","p":"(703) 862-9230"},{"g":"1","a":"616 Colchester Dr","lat":31.852622,"lon":-106.561698,"n":"Mary Martha Chavez","p":"(915) 259-6311"},{"g":"7","a":"811 Dulce Tierra Dr","lat":31.85654,"lon":-106.526718,"n":"Beverly Trevino","p":"(915) 920-8275"},{"g":"2","a":"601 El Parque Dr","lat":31.849773,"lon":-106.551392,"n":"Telma Lozano","p":"(915) 626-6181"},{"g":"5","a":"6877 Granero Dr","lat":31.843996,"lon":-106.54244,"n":"Edina Salazar","p":"(915) 227-3176"},{"g":"6","a":"921 Las Aves Pl","lat":31.862426,"lon":-106.545267,"n":"Michael Oyetunde","p":"(915) 867-9391"},{"g":"1","a":"737 Martha Gale Dr","lat":31.854453,"lon":-106.562206,"n":"Prospero Rivera","p":"(915) 820-4379"},{"g":"4","a":"870 Melville Ln","lat":31.859849,"lon":-106.564789,"n":"Belinda Armendariz","p":"(915) 244-4767"},{"g":"4","a":"744 Nita Fay Dr","lat":31.857862,"lon":-106.565947,"n":"Brandy Acosta","p":"(915) 352-3073"},{"g":"5","a":"6883 Oveja Ave","lat":31.848757,"lon":-106.545623,"n":"John Lowe","p":"(915) 588-1659"},{"g":"5","a":"6941 Polvadera Dr","lat":31.84616,"lon":-106.547815,"n":"Rita Alnajjar","p":"(214) 280-1130"},{"g":"5","a":"6916 Ramada Dr","lat":31.844989,"lon":-106.547106,"n":"Glynn Dodson","p":"(505) 269-2080"},{"g":"5","a":"6605 Southwind Dr","lat":31.84241,"lon":-106.537624,"n":"Kevin Fannin","p":"(505) 688-0208"},{"g":"2","a":"509 Tepic Dr","lat":31.85272,"lon":-106.552046,"n":"Enrique Meza","p":"(915) 252-2577"},{"g":"7","a":"6317 Via Serena Dr","lat":31.867695,"lon":-106.522989,"n":"Jaime Lowenberg","p":"(915) 526-4404"},{"g":"7","a":"987 Via Descanso Dr","lat":31.866092,"lon":-106.521105,"n":"Jose Verduzco","p":"(831) 359-0818"},{"g":"6","a":"6457 Via Aventura Dr","lat":31.854154,"lon":-106.536076,"n":"Elisabeth brines","p":"(915) 525-9162"},{"g":"2","a":"7064 Villa Hermosa Dr","lat":31.85035,"lon":-106.552281,"n":"Albert Hernandez","p":"(915) 503-8643"},{"g":"4","a":"7509 Windcrest Dr","lat":31.862515,"lon":-106.565387,"n":"Mary Duffy","p":"(915) 526-8136"}];

WO_STOPS.forEach(s=>{const meta=WO_GROUPS[s.g];if(!meta)return;L.circleMarker([s.lat,s.lon],{radius:8,color:"#111",weight:2,fillColor:meta.color,fillOpacity:1}).bindPopup(popupHtml(s,meta.name)).bindTooltip((s.n?s.n+" - ":"")+(s.p||s.a)).addTo(woLayers[s.g]);});
function addSoft(data){
 data.forEach(s=>{
  const key=(s.a||"")+"|"+(s.lat||"")+"|"+(s.lon||"");
  if(seenSS[key])return;seenSS[key]=1;
  const g=String(s.g).replace(/^SS/i,"");
  const meta=SS_GROUPS[g]||{name:"SS"+g,color:"#64748b"};
  if(!ssLayers[g])ssLayers[g]=L.layerGroup();
  L.circleMarker([s.lat,s.lon],{radius:8,color:"#111",weight:2,fillColor:meta.color,fillOpacity:1}).bindPopup(popupHtml(s,meta.name)).bindTooltip((s.n?s.n+" - ":"")+(s.p||s.a)).addTo(ssLayers[g]);
 });
 if(document.getElementById("tabSS").classList.contains("on"))showSS();
}
function clearAll(){Object.values(woLayers).forEach(l=>map.removeLayer(l));Object.values(ssLayers).forEach(l=>map.removeLayer(l));}
function setAll(layers,on){
 Object.keys(layers).forEach(k=>{
  const layer=layers[k];
  if(!layer || !layer.getLayers().length) return;
  if(on) map.addLayer(layer); else map.removeLayer(layer);
 });
 document.querySelectorAll("#legend input[type=checkbox]").forEach(cb=>cb.checked=on);
}
function renderLegend(groups,layers){
 const legend=document.getElementById("legend");legend.innerHTML="";
 const bulk=document.createElement("div");bulk.className="bulk";
 const all=document.createElement("button");all.type="button";all.textContent="Select all";
 const none=document.createElement("button");none.type="button";none.textContent="Deselect all";
 all.onclick=()=>setAll(layers,true);
 none.onclick=()=>setAll(layers,false);
 bulk.appendChild(all);bulk.appendChild(none);
 legend.appendChild(bulk);
 Object.entries(groups).forEach(([k,v])=>{
  const n=layers[k]?layers[k].getLayers().length:0;
  if(!n && groups!==WO_GROUPS) return;
  const row=document.createElement("label");row.className="row";
  row.innerHTML="<input type=checkbox checked><span class=dot style=background:"+v.color+"></span><span>"+v.name+" ("+n+")</span>";
  row.querySelector("input").onchange=e=>e.target.checked?map.addLayer(layers[k]):map.removeLayer(layers[k]);
  legend.appendChild(row);
 });
}
function showWO(){clearAll();Object.values(woLayers).forEach(l=>map.addLayer(l));document.getElementById("tabWO").classList.add("on");document.getElementById("tabSS").classList.remove("on");document.getElementById("subline").textContent="Work orders - tap pin for name and phone";renderLegend(WO_GROUPS,woLayers);}
function showSS(){clearAll();Object.values(ssLayers).forEach(l=>{if(l.getLayers().length)map.addLayer(l);});document.getElementById("tabSS").classList.add("on");document.getElementById("tabWO").classList.remove("on");document.getElementById("subline").textContent="Soft start - tap pin for name and phone";renderLegend(SS_GROUPS,ssLayers);}
Promise.all(["soft1.json","soft2.json","soft3.json","soft4.json"].map(f=>fetch(f+"?v=12").then(r=>r.ok?r.json():[]).catch(()=>[])))
 .then(parts=>addSoft([].concat.apply([],parts)))
 .catch(function(){});

function setAll(on){
 document.querySelectorAll("#legend input[type=checkbox]").forEach(cb=>{
  if(cb.checked!==on){cb.checked=on;cb.dispatchEvent(new Event("change"));}
 });
}
document.getElementById("tabWO").onclick=showWO;
document.getElementById("tabSS").onclick=showSS;
document.getElementById("btnAll").onclick=function(){setAll(true)};
document.getElementById("btnNone").onclick=function(){setAll(false)};
showWO();
</script></body></html>
