const DONE_KEY="wo-done-v1";
try{window._hideDone=localStorage.getItem("wo-hide-done")==="1"}catch(e){window._hideDone=false}
window._done=window._done||{};
function loadDone(){
 if(window._done && Object.keys(window._done).length) return window._done;
 try{window._done=JSON.parse(localStorage.getItem(DONE_KEY)||"{}")||{}}catch(e){window._done=window._done||{}}
 return window._done;
}
function saveDone(d){
 window._done=d||{};
 try{localStorage.setItem(DONE_KEY,JSON.stringify(window._done))}catch(e){}
}
function isDone(k){return !!(k && loadDone()[k])}
function setDone(k,on){
 if(!k) return;
 const d=loadDone();
 if(on) d[k]=1; else delete d[k];
 saveDone(d);
 if(document.getElementById("tabWO").classList.contains("on")) showWO();
 else rebuildWO();
}
function setDoneQuiet(k,on){if(!k)return;const d=loadDone();if(on)d[k]=1;else delete d[k];saveDone(d);}
function harvestDoneChecks(){
 document.querySelectorAll(".kid input[data-k]").forEach(function(cb){setDoneQuiet(cb.getAttribute("data-k"),cb.checked);});
}
function popupHtml(s,label,done){
 const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((s.a||"")+", El Paso, TX 79912");
 const digits=(s.p||"").replace(/\D/g,"");
 const tel=digits.length===11?"+"+digits:(digits.length===10?"+1"+digits:"");
 const name="<div class=pop-n>"+(s.n||"Name not on file")+"</div>";
 const phone=s.p?(tel?"<div class=pop-p><a href='tel:"+tel+"'>"+s.p+"</a></div>":"<div class=pop-p>"+s.p+"</div>"):"";
 const asg=s.asg?"<div>Assigned: "+s.asg+"</div>":"";
 const title=s.t?"<div>"+s.t+"</div>":"";
 const chk=s.k?("<label class=pop-done><input type=checkbox "+(done?"checked":"")+" onchange=\"setDone('"+s.k+"',this.checked)\"> Mark completed</label>"):"";
 return "<div class=pop-g>"+label+(s.k?" · "+s.k:"")+"</div><div class=pop-a>"+(s.n||"Name not on file")+"</div><div>"+(s.a||"")+"</div>"+phone+title+asg+"<div>"+(s.pri||"")+(s.st?" · "+s.st:"")+"</div><div><a href='"+maps+"' target=_blank rel=noopener>Google Maps</a></div>"+chk;
}
const woLayers={},ssLayers={},seenSS={};
Object.keys(WO_GROUPS).forEach(k=>woLayers[k]=L.layerGroup());
Object.keys(SS_GROUPS).forEach(k=>ssLayers[k]=L.layerGroup());
function rebuildWO(){
 Object.values(woLayers).forEach(l=>{l.clearLayers();});
 WO_STOPS.forEach(s=>{
  const meta=WO_GROUPS[s.g];if(!meta)return;
  const done=isDone(s.k);
  if(window._hideDone && done) return;
  const dark=["#7cff00","#00d4ff","#ffd000"].includes(meta.color);
  const m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:"sspin",html:"<i style=\"background:"+(done?"#64748b":meta.color)+";color:"+(dark&&!done?"#111":"#fff")+";opacity:"+(done?"0.45":"1")+"\">"+s.g+"</i>",iconSize:[22,22],iconAnchor:[11,11]})});
  m.bindPopup(()=>popupHtml(s,meta.name,isDone(s.k)));
  m.bindTooltip((done?"✓ ":"")+(s.n?s.n+" — ":"")+(s.a||""));
  m.addTo(woLayers[s.g]);
 });
}
rebuildWO();
function addSoft(data){
 data.forEach(s=>{
  const key=(s.a||"")+"|"+(s.lat||"")+"|"+(s.lon||"");
  if(seenSS[key])return;seenSS[key]=1;
  const g=String(s.g).replace(/^SS/i,"");
  const meta=SS_GROUPS[g]||{name:"SS"+g,color:"#64748b"};
  if(!ssLayers[g])ssLayers[g]=L.layerGroup();
  L.circleMarker([s.lat,s.lon],{radius:8,color:"#111",weight:2,fillColor:meta.color,fillOpacity:1}).bindPopup(popupHtml(s,meta.name,false)).bindTooltip((s.n?s.n+" — ":"")+(s.a||"")+(s.p?" — "+s.p:"")).addTo(ssLayers[g]);
 });
 if(document.getElementById("tabSS").classList.contains("on"))showSS();
}
function clearAll(){Object.values(woLayers).forEach(l=>map.removeLayer(l));Object.values(ssLayers).forEach(l=>map.removeLayer(l));}
function setAll(layers,on){
 Object.keys(layers).forEach(k=>{
  const layer=layers[k];
  if(!layer||!layer.getLayers().length)return;
  if(on)map.addLayer(layer);else map.removeLayer(layer);
 });
 document.querySelectorAll("#legend input.grp").forEach(cb=>cb.checked=on);
}
function renderLegend(groups,layers,isWO){
 const legend=document.getElementById("legend");
 legend.innerHTML="";
 try{
  const bulk=document.createElement("div");bulk.className="bulk";
  const all=document.createElement("button");all.type="button";all.textContent="Select all";
  const none=document.createElement("button");none.type="button";none.textContent="Deselect all";
  all.onclick=function(){setAll(layers,true)};
  none.onclick=function(){setAll(layers,false)};
  bulk.appendChild(all);bulk.appendChild(none);
  legend.appendChild(bulk);
  if(isWO){
   const hideLab=document.createElement("label");hideLab.className="hidetog";
   hideLab.innerHTML="<input type=checkbox> Hide completed";
   const hcb=hideLab.querySelector("input");
   hcb.checked=!!window._hideDone;
   hcb.onchange=function(){
     harvestDoneChecks();
     window._hideDone=hcb.checked;
     try{localStorage.setItem("wo-hide-done",window._hideDone?"1":"0")}catch(e){}
     rebuildWO();showWO();
   };
   legend.appendChild(hideLab);
  }
  Object.entries(groups).forEach(function(entry){
   const k=entry[0], v=entry[1];
   const members=isWO?WO_STOPS.filter(function(s){return String(s.g)===String(k) && (!window._hideDone || !isDone(s.k));}):[];
   const n=isWO?WO_STOPS.filter(function(s){return String(s.g)===String(k);}).length:(layers[k]?layers[k].getLayers().length:0);
   if(!n) return;
   const wrap=document.createElement("div");wrap.className="row";
   const head=document.createElement("div");head.className="ghead";
   const cb=document.createElement("input");cb.type="checkbox";cb.className="grp";cb.checked=true;
   cb.onchange=function(e){e.target.checked?map.addLayer(layers[k]):map.removeLayer(layers[k]);};
   const dot=document.createElement("span");dot.className="dot";dot.style.background=v.color;
   const lab=document.createElement("span");lab.className="grow";
   const open=isWO?members.filter(function(s){return !isDone(s.k);}).length:n;
   lab.textContent=v.name+" ("+open+(isWO?" open":"")+")";
   head.appendChild(cb);head.appendChild(dot);head.appendChild(lab);
   wrap.appendChild(head);
   if(isWO){
    const exp=document.createElement("button");exp.type="button";exp.textContent="Addresses";
    const kids=document.createElement("div");kids.className="kids";kids.style.display="none";
    exp.onclick=function(){kids.style.display=kids.style.display==="none"?"block":"none";};
    head.appendChild(exp);
    WO_STOPS.filter(function(s){return String(s.g)===String(k);}).forEach(function(s){
     if(window._hideDone && isDone(s.k)) return;
     const kid=document.createElement("label");
     kid.className="kid"+(isDone(s.k)?" done":"");
     const c=document.createElement("input");c.type="checkbox";c.setAttribute("data-k",s.k||"");c.checked=!!isDone(s.k);
     c.onchange=function(){setDoneQuiet(s.k,c.checked);rebuildWO();if(window._hideDone)showWO();};
     const tx=document.createElement("span");
     tx.innerHTML="<b>"+(s.n||"Name not on file")+"</b> — "+(s.a||"")+"<small>"+(s.p?s.p+" · ":"")+(s.asg?"Assigned: "+s.asg+" · ":"")+(s.t||"")+"</small>";
     kid.appendChild(c);kid.appendChild(tx);kids.appendChild(kid);
    });
    wrap.appendChild(kids);
   }
   legend.appendChild(wrap);
  });
 }catch(err){
  legend.textContent="Legend error: "+err.message;
 }
}
function showWO(){clearAll();rebuildWO();Object.values(woLayers).forEach(l=>{if(l.getLayers().length)map.addLayer(l);});document.getElementById("tabWO").classList.add("on");document.getElementById("tabSS").classList.remove("on");document.getElementById("subline").textContent="Work orders — expand a group for addresses. Check a ticket to mark it complete.";renderLegend(WO_GROUPS,woLayers,true);}
function showSS(){clearAll();Object.values(ssLayers).forEach(l=>{if(l.getLayers().length)map.addLayer(l);});document.getElementById("tabSS").classList.add("on");document.getElementById("tabWO").classList.remove("on");document.getElementById("subline").textContent="Soft start - tap pin for name and phone";renderLegend(SS_GROUPS,ssLayers,false);}
addSoft(SS_STOPS);
addSoft(SS_STOPS);
Promise.all(["soft1.json","soft2.json","soft3.json","soft4.json"].map(f=>fetch(f+"?v=18").then(r=>r.ok?r.json():[]).catch(()=>[])))
 .then(parts=>addSoft([].concat.apply([],parts)))
 .catch(function(){});
document.getElementById("tabWO").onclick=showWO;
document.getElementById("tabSS").onclick=showSS;
showWO();
</script></body></html>
