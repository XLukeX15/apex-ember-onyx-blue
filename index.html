<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>El Paso West Side — 79912</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root { --bg:#0f172a; --card:#111827ee; --text:#f8fafc; --muted:#94a3b8; }
  html,body { margin:0; height:100%; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  #map { position:fixed; inset:0; }
  .panel {
    position:fixed; z-index:1000; left:12px; bottom:12px; max-width:340px; width:calc(100% - 24px);
    background:var(--card); backdrop-filter:blur(10px); border:1px solid #334155; border-radius:14px;
    padding:12px 14px; box-shadow:0 10px 30px #0008;
  }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .row { display:flex; align-items:center; gap:8px; font-size:13px; padding:3px 0; cursor:pointer; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; border:2px solid #fff; }
  .sq { width:12px; height:12px; border-radius:2px; flex:none; border:2px solid #fff; }
  a { color:#93c5fd; }
  .leaflet-popup-content { color:#0f172a; font-size:13px; }
  .new { color:#b45309; font-weight:700; }
</style>
</head>
<body>
<div id="map"></div>
<aside class="panel">
  <h1>El Paso West Side — 79912</h1>
  <p class="sub">27 addresses · 6 groups · star = newly added</p>
  <div id="legend"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const GROUPS = {
  A: { name:"A · Lakehurst North", color:"#1e3a8a", count:"4 · 1 new" },
  B: { name:"B · Lakehurst South", color:"#b91c1c", count:"6 · 2 new" },
  C: { name:"C · El Parque / Villa Hermosa", color:"#166534", count:"3" },
  D: { name:"D · Ranchos / Southwind", color:"#ea580c", count:"5" },
  E: { name:"E · Park Hills / Las Aves", color:"#7c3aed", count:"5" },
  F: { name:"F · Via Serena / Calle Lago", color:"#0d9488", count:"4" }
};
const STOPS = [
  {g:"A", new:false, name:"7509 Windcrest Dr", lat:31.862515, lon:-106.565387},
  {g:"A", new:false, name:"870 Melville Ln", lat:31.859849, lon:-106.564789},
  {g:"A", new:false, name:"744 Nita Fay Dr", lat:31.857862, lon:-106.565947},
  {g:"A", new:true,  name:"8700 Lakehurst Rd", lat:31.859491, lon:-106.568342},
  {g:"B", new:false, name:"735 Arredondo Dr", lat:31.856610, lon:-106.562403},
  {g:"B", new:false, name:"737 Martha Gale Dr", lat:31.854453, lon:-106.562206},
  {g:"B", new:false, name:"616 Colchester Dr", lat:31.852622, lon:-106.561698},
  {g:"B", new:false, name:"640 Bristol Dr", lat:31.850868, lon:-106.558678},
  {g:"B", new:true,  name:"7424 Lakehurst Rd", lat:31.852083, lon:-106.561690},
  {g:"B", new:true,  name:"7533 Lakehurst Rd", lat:31.855235, lon:-106.564962, note:"Interpolated — OSM has no house pin"},
  {g:"C", new:false, name:"601 El Parque Dr", lat:31.849773, lon:-106.551392},
  {g:"C", new:false, name:"509 Tepic Dr", lat:31.852720, lon:-106.552046},
  {g:"C", new:false, name:"7064 Villa Hermosa Dr", lat:31.850350, lon:-106.552281},
  {g:"D", new:false, name:"6883 Oveja Ave", lat:31.848757, lon:-106.545623},
  {g:"D", new:false, name:"6941 Polvadera Dr", lat:31.846160, lon:-106.547815},
  {g:"D", new:false, name:"6916 Ramada Dr", lat:31.844989, lon:-106.547106},
  {g:"D", new:false, name:"6877 Granero Dr", lat:31.843996, lon:-106.542440},
  {g:"D", new:false, name:"6605 Southwind Dr", lat:31.842410, lon:-106.537624},
  {g:"E", new:false, name:"6484 Calle Placido Dr", lat:31.866855, lon:-106.534987},
  {g:"E", new:false, name:"6452 Calle Vista Dr", lat:31.865396, lon:-106.533087},
  {g:"E", new:false, name:"6617 Brisa Del Mar Dr", lat:31.860943, lon:-106.540382},
  {g:"E", new:false, name:"921 Las Aves Pl", lat:31.862426, lon:-106.545267},
  {g:"E", new:false, name:"6457 Via Aventura Dr", lat:31.854154, lon:-106.536076},
  {g:"F", new:false, name:"1337 Calle Lago", lat:31.868948, lon:-106.520155},
  {g:"F", new:false, name:"6317 Via Serena Dr", lat:31.867695, lon:-106.522989},
  {g:"F", new:false, name:"987 Via Descanso Dr", lat:31.866092, lon:-106.521105},
  {g:"F", new:false, name:"811 Dulce Tierra Dr", lat:31.856540, lon:-106.526718}
];

const map = L.map("map", { zoomControl:true }).setView([31.855, -106.545], 14);
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "© OpenStreetMap"
}).addTo(map);
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19,
  attribution: "Esri"
});
L.control.layers({ "OpenStreetMap": osm, "Esri Streets": esri }).addTo(map);

const layers = {};
Object.keys(GROUPS).forEach(k => { layers[k] = L.layerGroup().addTo(map); });

function icon(color, isNew) {
  const html = isNew
    ? `<div style="width:22px;height:22px;color:${color};filter:drop-shadow(0 1px 2px #0008);font-size:22px;line-height:22px">★</div>`
    : `<div style="width:14px;height:14px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px #0006"></div>`;
  return L.divIcon({ className:"", html, iconSize:[22,22], iconAnchor:[11,11] });
}

STOPS.forEach(s => {
  const q = encodeURIComponent(s.name + ", El Paso, TX 79912");
  const extra = s.note ? `<div style="color:#92400e">${s.note}</div>` : "";
  const mark = s.new ? ` <span class="new">NEW</span>` : "";
  L.marker([s.lat, s.lon], { icon: icon(GROUPS[s.g].color, s.new) })
    .bindPopup(`<strong>${s.name}${mark}</strong><br>Group ${s.g}<br>${extra}<a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Google Maps</a>`)
    .addTo(layers[s.g]);
});

const legend = document.getElementById("legend");
Object.entries(GROUPS).forEach(([k, v]) => {
  const row = document.createElement("label");
  row.className = "row";
  row.innerHTML = `<input type="checkbox" checked data-g="${k}"/><span class="dot" style="background:${v.color}"></span><span>${v.name} <span style="color:#94a3b8">(${v.count})</span></span>`;
  row.querySelector("input").addEventListener("change", e => {
    if (e.target.checked) map.addLayer(layers[k]); else map.removeLayer(layers[k]);
  });
  legend.appendChild(row);
});
</script>
</body>
</html>
