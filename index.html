<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>El Paso West Side — 79912</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root { --bg:#0f172a; --card:#111827ee; --text:#f8fafc; --muted:#94a3b8; }
  html,body { margin:0; height:100%; font-family: ui-sans-serif, system-ui, sans-serif; background:var(--bg); color:var(--text); }
  #map { position:fixed; inset:0; }
  .panel {
    position:fixed; z-index:1000; left:12px; bottom:12px; max-width:360px; width:calc(100% - 24px);
    max-height:72vh; overflow:auto;
    background:var(--card); backdrop-filter:blur(10px); border:1px solid #334155; border-radius:14px;
    padding:12px 14px; box-shadow:0 10px 30px #0008;
  }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .tabs { display:flex; gap:6px; margin:0 0 8px; }
  .tabs button { flex:1; border:1px solid #334155; background:#0b1220; color:#e2e8f0; border-radius:8px; padding:6px 8px; cursor:pointer; font-size:12px; }
  .tabs button.on { background:#1d4ed8; border-color:#1d4ed8; }
  .row { display:flex; align-items:center; gap:8px; font-size:12px; padding:2px 0; cursor:pointer; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; border:2px solid #fff; }
  a { color:#93c5fd; }
  .leaflet-popup-content { color:#0f172a; font-size:13px; }
  .new { color:#b45309; font-weight:700; }
</style>
</head>
<body>
<div id="map"></div>
<aside class="panel">
  <h1>El Paso West Side — 79912</h1>
  <div class="tabs">
    <button id="tabWO" class="on">Work orders</button>
    <button id="tabSS">Soft start</button>
  </div>
  <p class="sub" id="subline">Tickets · groups of 3–5</p>
  <div id="legend"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WO_GROUPS = {
  A: { name:"A · Lakehurst North", color:"#1e3a8a", count:"4 · 1 new" },
  B: { name:"B · Lakehurst South", color:"#b91c1c", count:"6 · 2 new" },
  C: { name:"C · El Parque / Villa Hermosa", color:"#166534", count:"3" },
  D: { name:"D · Ranchos / Southwind", color:"#ea580c", count:"5" },
  E: { name:"E · Park Hills / Las Aves", color:"#7c3aed", count:"5" },
  F: { name:"F · Via Serena / Calle Lago", color:"#0d9488", count:"4" }
};
const WO_STOPS = [
  {g:"A", neu:false, name:"7509 Windcrest Dr", lat:31.862515, lon:-106.565387},
  {g:"A", neu:false, name:"870 Melville Ln", lat:31.859849, lon:-106.564789},
  {g:"A", neu:false, name:"744 Nita Fay Dr", lat:31.857862, lon:-106.565947},
  {g:"A", neu:true,  name:"8700 Lakehurst Rd", lat:31.859491, lon:-106.568342},
  {g:"B", neu:false, name:"735 Arredondo Dr", lat:31.856610, lon:-106.562403},
  {g:"B", neu:false, name:"737 Martha Gale Dr", lat:31.854453, lon:-106.562206},
  {g:"B", neu:false, name:"616 Colchester Dr", lat:31.852622, lon:-106.561698},
  {g:"B", neu:false, name:"640 Bristol Dr", lat:31.850868, lon:-106.558678},
  {g:"B", neu:true,  name:"7424 Lakehurst Rd", lat:31.852083, lon:-106.561690},
  {g:"B", neu:true,  name:"7533 Lakehurst Rd", lat:31.855235, lon:-106.564962},
  {g:"C", neu:false, name:"601 El Parque Dr", lat:31.849773, lon:-106.551392},
  {g:"C", neu:false, name:"509 Tepic Dr", lat:31.852720, lon:-106.552046},
  {g:"C", neu:false, name:"7064 Villa Hermosa Dr", lat:31.850350, lon:-106.552281},
  {g:"D", neu:false, name:"6883 Oveja Ave", lat:31.848757, lon:-106.545623},
  {g:"D", neu:false, name:"6941 Polvadera Dr", lat:31.846160, lon:-106.547815},
  {g:"D", neu:false, name:"6916 Ramada Dr", lat:31.844989, lon:-106.547106},
  {g:"D", neu:false, name:"6877 Granero Dr", lat:31.843996, lon:-106.542440},
  {g:"D", neu:false, name:"6605 Southwind Dr", lat:31.842410, lon:-106.537624},
  {g:"E", neu:false, name:"6484 Calle Placido Dr", lat:31.866855, lon:-106.534987},
  {g:"E", neu:false, name:"6452 Calle Vista Dr", lat:31.865396, lon:-106.533087},
  {g:"E", neu:false, name:"6617 Brisa Del Mar Dr", lat:31.860943, lon:-106.540382},
  {g:"E", neu:false, name:"921 Las Aves Pl", lat:31.862426, lon:-106.545267},
  {g:"E", neu:false, name:"6457 Via Aventura Dr", lat:31.854154, lon:-106.536076},
  {g:"F", neu:false, name:"1337 Calle Lago", lat:31.868948, lon:-106.520155},
  {g:"F", neu:false, name:"6317 Via Serena Dr", lat:31.867695, lon:-106.522989},
  {g:"F", neu:false, name:"987 Via Descanso Dr", lat:31.866092, lon:-106.521105},
  {g:"F", neu:false, name:"811 Dulce Tierra Dr", lat:31.856540, lon:-106.526718}
];
const SS_GROUPS = {
  1: { name:"SS1 Lakehurst / Windcrest / Nita Fay", color:"#1e3a8a", count:"28" },
  2: { name:"SS2 Arredondo / Bristol / Dorsey", color:"#b91c1c", count:"28" },
  3: { name:"SS3 Le Conte / Waterhouse", color:"#c2410c", count:"17" },
  4: { name:"SS4 Desert Eagle / Cactus / Gran Vida", color:"#a16207", count:"16" },
  5: { name:"SS5 El Parque / Agua Caliente", color:"#166534", count:"21" },
  6: { name:"SS6 Villa Hermosa / Imus", color:"#0f766e", count:"13" },
  7: { name:"SS7 Brisa Del Mar", color:"#7c3aed", count:"17" },
  8: { name:"SS8 Park Hills / Aves / Fuente", color:"#6d28d9", count:"25" },
  9: { name:"SS9 Via Serena / Lago / Cerrito", color:"#0d9488", count:"26" },
  10: { name:"SS10 Dulce Tierra / De La Paz", color:"#2563eb", count:"30" },
  11: { name:"SS11 Ranchos Oveja / Granero / Ramada", color:"#ea580c", count:"22" },
  12: { name:"SS12 Orizaba / Cadena / Cresta", color:"#d97706", count:"25" },
  13: { name:"SS13 Isla Del Rey / Pino Real", color:"#be185d", count:"22" },
  14: { name:"SS14 La Posta / Loma De Cristo", color:"#0369a1", count:"27" },
  15: { name:"SS15 Pilgrimage / Saratoga", color:"#4c1d95", count:"17" },
  16: { name:"SS16 Pueblos / Cuesta / Norte", color:"#15803d", count:"22" },
  17: { name:"SS17 Firestar / Thorn / Cascade", color:"#9333ea", count:"23" },
  18: { name:"SS18 Other westside streets", color:"#64748b", count:"30" },
  19: { name:"SS19 Mission Viejo / Royal Arms", color:"#9a3412", count:"17" },
  21: { name:"SS21 Tepic / Villa Vanessa / Cueto", color:"#047857", count:"20" },
  22: { name:"SS22 Metate / plazas", color:"#7e22ce", count:"18" }
};
let SS_STOPS = [];
const map = L.map("map", { zoomControl:true }).setView([31.855, -106.545], 14);
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19, attribution:"© OpenStreetMap" }).addTo(map);
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom:19, attribution:"Esri" });
L.control.layers({ "OpenStreetMap": osm, "Esri Streets": esri }).addTo(map);
function icon(color, star) {
  const html = star
    ? `<div style="width:22px;height:22px;color:${color};filter:drop-shadow(0 1px 2px #0008);font-size:22px;line-height:22px">★</div>`
    : `<div style="width:12px;height:12px;background:${color};border:2px solid #fff;border-radius:50%;box-shadow:0 1px 3px #0006"></div>`;
  return L.divIcon({ className:"", html, iconSize:[22,22], iconAnchor:[11,11] });
}
const woLayers = {}, ssLayers = {};
Object.keys(WO_GROUPS).forEach(k => woLayers[k] = L.layerGroup());
Object.keys(SS_GROUPS).forEach(k => ssLayers[k] = L.layerGroup());
WO_STOPS.forEach(s => {
  const q = encodeURIComponent(s.name + ", El Paso, TX 79912");
  L.marker([s.lat,s.lon], { icon: icon(WO_GROUPS[s.g].color, s.neu) })
    .bindPopup(`<strong>${s.name}${s.neu?" <span class=new>NEW</span>":""}</strong><br>Work-order group ${s.g}<br><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google Maps</a>`)
    .addTo(woLayers[s.g]);
});
function clearAll() {
  Object.values(woLayers).forEach(l => map.removeLayer(l));
  Object.values(ssLayers).forEach(l => map.removeLayer(l));
}
function showWO() {
  clearAll();
  Object.values(woLayers).forEach(l => map.addLayer(l));
  document.getElementById("tabWO").classList.add("on");
  document.getElementById("tabSS").classList.remove("on");
  document.getElementById("subline").textContent = "Work orders · 27 tickets · groups of 3–5";
  renderLegend(WO_GROUPS, woLayers);
}
function showSS() {
  clearAll();
  Object.values(ssLayers).forEach(l => map.addLayer(l));
  document.getElementById("tabSS").classList.add("on");
  document.getElementById("tabWO").classList.remove("on");
  document.getElementById("subline").textContent = "Soft start · " + SS_STOPS.length + " deals · groups up to 30 · phones omitted (public map)";
  renderLegend(SS_GROUPS, ssLayers);
}
function renderLegend(groups, layers) {
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  Object.entries(groups).forEach(([k,v]) => {
    const row = document.createElement("label");
    row.className = "row";
    row.innerHTML = `<input type="checkbox" checked data-k="${k}"/><span class="dot" style="background:${v.color}"></span><span>${v.name} <span style="color:#94a3b8">(${v.count})</span></span>`;
    row.querySelector("input").addEventListener("change", e => {
      if (e.target.checked) map.addLayer(layers[k]); else map.removeLayer(layers[k]);
    });
    legend.appendChild(row);
  });
}
fetch("soft.json").then(r=>r.json()).then(data=>{
  SS_STOPS = data;
  data.forEach(s => {
    const q = encodeURIComponent(s.a + ", El Paso, TX 79912");
    const g = String(s.g);
    L.circleMarker([s.lat,s.lon], { radius:5, color:"#fff", weight:1, fillColor:SS_GROUPS[g].color, fillOpacity:0.9 })
      .bindPopup(`<strong>${s.a}</strong><br>${SS_GROUPS[g].name}<br><a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google Maps</a>`)
      .addTo(ssLayers[g]);
  });
});
document.getElementById("tabWO").onclick = showWO;
document.getElementById("tabSS").onclick = showSS;
showWO();
</script>
</body>
</html>
