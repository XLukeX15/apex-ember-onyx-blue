<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>El Paso West Side — 79912</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root { --bg:#0f172a; --card:#111827f2; --text:#f8fafc; --muted:#94a3b8; }
  html,body { margin:0; height:100%; font-family:ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--text); }
  #map { position:fixed; inset:0; }
  .panel {
    position:fixed; z-index:1000; left:12px; bottom:12px; max-width:360px; width:calc(100% - 24px);
    max-height:min(70vh, 520px); overflow:auto;
    background:var(--card); backdrop-filter:blur(10px); border:1px solid #334155; border-radius:14px;
    padding:12px 14px; box-shadow:0 10px 30px #0008;
  }
  h1 { font-size:15px; margin:0 0 4px; }
  .sub { font-size:12px; color:var(--muted); margin:0 0 8px; }
  .tabs { display:flex; gap:6px; margin:0 0 8px; }
  .tabs button { flex:1; border:1px solid #334155; background:#1e293b; color:#e2e8f0; border-radius:8px; padding:6px 8px; cursor:pointer; font-size:12px; }
  .tabs button.on { background:#1d4ed8; border-color:#2563eb; }
  .row { display:flex; align-items:center; gap:8px; font-size:12px; padding:2px 0; cursor:pointer; }
  .dot { width:10px; height:10px; border-radius:50%; flex:none; border:2px solid #fff; }
  .leaflet-popup-content { color:#0f172a; font-size:13px; }
  a { color:#93c5fd; }
</style>
</head>
<body>
<div id="map"></div>
<aside class="panel">
  <h1>El Paso West Side — 79912</h1>
  <p class="sub" id="sub"></p>
  <div class="tabs">
    <button id="tabWO" class="on">Work orders</button>
    <button id="tabSS">Soft start</button>
  </div>
  <div id="legend"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const DATA = window.DATA;
const COLORS = ["#64748b","#1d4ed8","#b91c1c","#0f766e","#a16207","#7c3aed","#be185d","#0369a1","#15803d","#c2410c","#6d28d9","#0e7490","#b45309","#047857","#1e40af","#9f1239","#365314","#334155","#7f1d1d","#155e75"];
const map = L.map("map").setView([31.855,-106.545], 13);
const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const esri = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"});
L.control.layers({"OpenStreetMap":osm,"Esri Streets":esri}).addTo(map);

function woLayers(){
  const out = {};
  DATA.tickets.forEach(t => {
    const g = String(t[0]);
    if(!out[g]) out[g] = L.layerGroup();
    L.circleMarker([t[2],t[3]], {radius:7, color:"#fff", weight:1, fillColor:COLORS[+g]||"#334155", fillOpacity:0.95})
      .bindPopup("<strong>"+t[1]+"</strong><br>Work order group "+g)
      .addTo(out[g]);
  });
  return out;
}
function ssLayers(){
  const out = {};
  DATA.soft.forEach(t => {
    const g = String(t[0]);
    if(!out[g]) out[g] = L.layerGroup();
    L.circleMarker([t[3],t[4]], {radius:5, color:"#fff", weight:1, fillColor:COLORS[+g]||"#334155", fillOpacity:0.85})
      .bindPopup("<strong>"+t[1]+"</strong><br>"+t[2]+"<br>Soft-start group "+g)
      .addTo(out[g]);
  });
  return out;
}
const WO = woLayers();
const SS = ssLayers();
let mode = "wo";
let current = WO;

function clearLayers(){
  Object.values(current).forEach(l => map.removeLayer(l));
}
function show(modeName){
  clearLayers();
  mode = modeName;
  current = mode==="wo" ? WO : SS;
  document.getElementById("tabWO").classList.toggle("on", mode==="wo");
  document.getElementById("tabSS").classList.toggle("on", mode==="ss");
  const legend = document.getElementById("legend");
  legend.innerHTML = "";
  if(mode==="wo"){
    document.getElementById("sub").textContent = "31 work orders · due Sep 11 · 7 color groups";
    const labels = {1:"1 Lakehurst mid",2:"2 Villa / El Parque",3:"3 Le Conte",4:"4 Lakehurst North",5:"5 Ranchos",6:"6 Park Hills",7:"7 Via Serena"};
    Object.keys(WO).sort().forEach(g => {
      map.addLayer(WO[g]);
      const row = document.createElement("label");
      row.className = "row";
      row.innerHTML = `<input type="checkbox" checked data-g="${g}"/><span class="dot" style="background:${COLORS[+g]}"></span><span>${labels[g]||g}</span>`;
      row.querySelector("input").onchange = e => { if(e.target.checked) map.addLayer(WO[g]); else map.removeLayer(WO[g]); };
      legend.appendChild(row);
    });
  } else {
    document.getElementById("sub").textContent = DATA.soft.length + " soft-start homes · groups of ~30 · phones omitted from public map";
    DATA.meta.forEach(([g,name,n]) => {
      map.addLayer(SS[String(g)]);
      const row = document.createElement("label");
      row.className = "row";
      row.innerHTML = `<input type="checkbox" checked data-g="${g}"/><span class="dot" style="background:${COLORS[g]}"></span><span>${g}. ${name} <span style="color:#94a3b8">(${n})</span></span>`;
      row.querySelector("input").onchange = e => { if(e.target.checked) map.addLayer(SS[String(g)]); else map.removeLayer(SS[String(g)]); };
      legend.appendChild(row);
    });
  }
}
document.getElementById("tabWO").onclick = () => show("wo");
document.getElementById("tabSS").onclick = () => show("ss");
show("wo");
</script>
</body>
</html>
