<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>El Paso West Side 79912</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
html,body{margin:0;height:100%;font-family:system-ui,sans-serif}
#map{position:fixed;inset:0}
.panel{position:fixed;z-index:1000;left:12px;bottom:12px;max-width:360px;width:calc(100% - 24px);max-height:72vh;overflow:auto;background:#111827f2;color:#f8fafc;border:1px solid #334155;border-radius:14px;padding:12px 14px}
h1{font-size:15px;margin:0 0 4px}
.sub{font-size:12px;color:#94a3b8;margin:0 0 8px}
.tabs{display:flex;gap:6px;margin:0 0 8px}
.tabs button{flex:1;border:1px solid #334155;background:#0b1220;color:#e2e8f0;border-radius:8px;padding:6px 8px;cursor:pointer}
.tabs button.on{background:#1d4ed8}
.row{display:flex;align-items:center;gap:8px;font-size:12px;padding:2px 0;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #111}
.sspin{background:transparent;border:0}
.sspin i{display:block;width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #111;color:#fff;font:700 10px/18px system-ui,sans-serif;text-align:center;text-shadow:0 1px 1px #000}
.leaflet-popup-content{color:#0f172a;min-width:200px}
.pop-a{font-weight:700}
.pop-p{font-weight:600}
.pop-g{font-size:11px;color:#64748b}
a{color:#2563eb}
</style></head>
<body>
<div id="map"></div>
<aside class="panel">
<h1>El Paso West Side 79912</h1>
<div class="tabs"><button id="tabWO" class="on">Work orders</button><button id="tabSS">Soft start</button></div>
<p class="sub" id="subline">Tap a pin for name and phone</p>
<div id="legend"></div>
</aside>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WO_GROUPS={1:{name:"1 Lakehurst mid",color:"#0057ff"},2:{name:"2 Villa Vanessa / El Parque",color:"#00b341"},3:{name:"3 Le Conte",color:"#ff6a00"},4:{name:"4 Lakehurst North",color:"#b000ff"},5:{name:"5 Ranchos / Southwind",color:"#9b2d00"},6:{name:"6 Park Hills / Las Aves",color:"#ff2e93"},7:{name:"7 Via Serena / Calle Lago",color:"#00564d"}};
const SS_GROUPS={1:{name:"SS1 Lakehurst / Windcrest",color:"#0057ff"},2:{name:"SS2 Arredondo / Bristol",color:"#e10600"},3:{name:"SS3 Le Conte",color:"#ff6a00"},4:{name:"SS4 Desert Eagle",color:"#ffd000"},5:{name:"SS5 El Parque",color:"#00b341"},6:{name:"SS6 Villa Hermosa",color:"#00d4ff"},7:{name:"SS7 Brisa Del Mar",color:"#b000ff"},8:{name:"SS8 Park Hills / Aves",color:"#ff2e93"},9:{name:"SS9 Via Serena / Lago",color:"#00564d"},10:{name:"SS10 Dulce Tierra",color:"#174ea6"},11:{name:"SS11 Ranchos",color:"#9b2d00"},12:{name:"SS12 Orizaba / Cadena",color:"#7cff00"},13:{name:"SS13 Isla Del Rey / Pino Real",color:"#c4006a"},14:{name:"SS14 La Posta / Loma",color:"#0091ea"},15:{name:"SS15 Pilgrimage / Saratoga",color:"#2d0b8a"},16:{name:"SS16 Pueblos / Cuesta",color:"#145a24"},17:{name:"SS17 Firestar / Thorn",color:"#ff1744"},18:{name:"SS18 Other westside",color:"#111827"},19:{name:"SS19 Mission Viejo",color:"#6d4c41"},21:{name:"SS21 Tepic / Villa Vanessa",color:"#00bfa5"},22:{name:"SS22 Metate / plazas",color:"#6200ea"}};
const map=L.map("map").setView([31.855,-106.545],14);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"OSM"}).addTo(map);
function popupHtml(s,label){
 const maps="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent((s.a||"")+", El Paso, TX 79912");
 const digits=(s.p||"").replace(/\D/g,"");
 const tel=digits.length===11?"+"+digits:(digits.length===10?"+1"+digits:"");
 const name=s.n?"<div>"+s.n+"</div>":"";
 const phone=s.p?(tel?"<div class=pop-p><a href='tel:"+tel+"'>"+s.p+"</a></div>":"<div class=pop-p>"+s.p+"</div>"):"";
 return "<div class=pop-g>"+label+"</div><div class=pop-a>"+(s.a||"")+"</div>"+name+phone+"<div><a href='"+maps+"' target=_blank rel=noopener>Google Maps</a></div>";
}
const woLayers={},ssLayers={},seenSS={};
Object.keys(WO_GROUPS).forEach(k=>woLayers[k]=L.layerGroup());
Object.keys(SS_GROUPS).forEach(k=>ssLayers[k]=L.layerGroup());
</script></body></html>
